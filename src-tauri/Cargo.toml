[package]
name = "glasspane"
version = "0.1.0"
description = "A fast, lightweight personal image viewer"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glasspane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25" }            # WebP/JPEG/PNG/GIF decode (pure Rust); AVIF is handled by avif.rs
zip = "2"
tauri-plugin-dialog = "2"               # native folder picker
tauri-plugin-window-state = "2"         # remember window size/position across launches
trash = "5"                             # delete to the OS recycle bin (fsops.rs)
open = "5"                              # open a file with the OS default app (fsops.rs)

# AVIF decode is pure Rust: `avif-parse` reads the container (primary + alpha
# AV1 items) and `rav1d` — the Rust port of dav1d — decodes them (see avif.rs).
# No system libraries, so it is on by default on every platform. `asm` is left
# off so Windows/macOS need no NASM; still images decode fast enough without it.
#
# rav1d's safe Rust API (`Decoder`/`Picture`/`Settings`) is not in the 1.1.0
# release yet — that crate only exports the C ABI — so pin the upstream commit
# that has it. Switch to a crates.io version once one ships with `rust_api`.
rav1d = { git = "https://github.com/memorysafety/rav1d", rev = "d3d1cd67059f47803919be8276650e5870c9fd02", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }
avif-parse = { version = "2.1", optional = true }

[features]
default = ["avif"]
avif = ["dep:rav1d", "dep:avif-parse"]
